<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - IoT Charging</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .plug-card { transition: transform 0.2s; }
        .plug-card:hover { transform: translateY(-5px); }
        .power-value { font-size: 2rem; font-weight: bold; color: #0d6efd; }
        .status-dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .bg-libre { background-color: #198754; }
        .bg-occupied { background-color: #dc3545; }
        .bg-hs { background-color: #6c757d; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"><i class="fas fa-bolt text-warning"></i> IoT Charging Station - Admin</span>
    </div>
</nav>

<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h3>État du Parc</h3>
            <p class="text-muted">Supervision en temps réel des prises connectées.</p>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-primary" onclick="loadPlugs()"><i class="fas fa-sync"></i> Actualiser</button>
        </div>
    </div>

    <!-- Zone où les prises vont s'afficher -->
    <div class="row" id="plugs-container">
        <div class="col-12 text-center">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Chargement des prises...</p>
        </div>
    </div>
</div>

<!-- Socket.io Client -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    // Configuration : Adapter l'URL si l'API n'est pas sur le même port/domaine
    // On laisse vide pour utiliser une URL relative. Le navigateur contactera le même serveur qui a servi cette page.
    const API_URL = ''; 
    
    // Connexion WebSocket
    const socket = io(API_URL);

    socket.on('connect', () => {
        console.log("✅ Connecté au WebSocket !");
    });

    // Écoute des mises à jour de puissance (Temps réel)
    socket.on('power_update', (data) => {
        // data = { plugId: 'S1-01', power: 45.2 }
        const powerElement = document.getElementById(`power-${data.plugId}`);
        if (powerElement) {
            powerElement.innerText = data.power.toFixed(1) + ' W';
            
            // Animation visuelle
            powerElement.style.color = '#dc3545'; // Rouge flash
            setTimeout(() => { powerElement.style.color = '#0d6efd'; }, 300);
        }
    });

    // Fonction pour charger les prises depuis l'API
    async function loadPlugs() {
        try {
            const response = await fetch(`${API_URL}/api/plugs`);
            const plugs = await response.json();
            renderPlugs(plugs);
        } catch (error) {
            console.error("Erreur chargement:", error);
            document.getElementById('plugs-container').innerHTML = `<div class="alert alert-danger">Impossible de charger les prises. L'API est-elle lancée ?</div>`;
        }
    }

    // Fonction pour générer le HTML des cartes
    function renderPlugs(plugs) {
        const container = document.getElementById('plugs-container');
        container.innerHTML = '';

        plugs.forEach(plug => {
            const statusColor = plug.status === 'libre' ? 'bg-libre' : (plug.status === 'occupied' ? 'bg-occupied' : 'bg-hs');
            const statusText = plug.status === 'libre' ? 'Disponible' : (plug.status === 'occupied' ? 'En charge' : 'Hors Service');
            
            const cardHtml = `
                <div class="col-md-4 col-lg-3 mb-4">
                    <div class="card plug-card shadow-sm h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <strong>${plug.id}</strong>
                            <span class="badge rounded-pill ${plug.status === 'libre' ? 'text-bg-success' : 'text-bg-danger'}">${plug.status}</span>
                        </div>
                        <div class="card-body text-center">
                            <h6 class="card-subtitle mb-2 text-muted">Puissance Instantanée</h6>
                            <div class="power-value" id="power-${plug.id}">0.0 W</div>
                            <hr>
                            <div class="d-grid gap-2">
                                <a href="${API_URL}/api/plugs/${plug.id}/qrcode" target="_blank" class="btn btn-outline-dark btn-sm">
                                    <i class="fas fa-qrcode"></i> Imprimer QR
                                </a>
                            </div>
                        </div>
                        <div class="card-footer text-muted small">
                            <span class="status-dot ${statusColor}"></span> ${statusText}
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHtml;
        });
    }

    // Chargement initial
    loadPlugs();
</script>
</body>
</html>
